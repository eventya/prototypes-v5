<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pagina de upgrade · Tranziția pe abonamente</title>
  <script>
    (function () {
      var t = localStorage.getItem('proto-theme');
      if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
  <link rel="stylesheet" href="../../assets/application.css">
</head>
<body class="bg-surface-0 text-ink-800 font-sans antialiased">

  <div class="rounded-xl border border-amber-200 dark:border-amber-500/20 bg-amber-50/60 dark:bg-amber-500/5 px-4 py-2.5 m-4 flex flex-wrap gap-3 items-center justify-between">
    <div class="flex items-center gap-2">
      <span class="w-1.5 h-1.5 rounded-full bg-amber-500"></span>
      <span class="text-[11px] font-semibold text-amber-700 dark:text-amber-300">#2 · Abonament Eventya: pagina de upgrade</span>
    </div>
    <a href="index.html" class="text-[11px] font-medium text-amber-700 dark:text-amber-300 hover:underline">← înapoi la set</a>
  </div>

  <header class="flex items-center h-14 px-4 bg-surface-0 border-y border-surface-200">
    <div class="flex items-center w-full h-full gap-6">
      <a class="flex items-center gap-2.5">
        <div class="w-7 h-7 rounded-lg bg-linear-to-br from-primary-500 to-primary-400 flex items-center justify-center text-white text-[10px] font-bold shadow-sm">MD</div>
        <span class="text-sm font-semibold text-ink-900 max-w-32 truncate">Muzeul Demo</span>
      </a>
      <nav class="hidden md:flex items-stretch self-stretch gap-1 mx-auto">
        <a class="inline-flex items-center px-3.5 text-sm border-b-2 -mb-px border-transparent text-ink-500 font-medium">Site web</a>
        <a class="inline-flex items-center px-3.5 text-sm border-b-2 -mb-px border-transparent text-ink-500 font-medium">Media</a>
        <a class="inline-flex items-center px-3.5 text-sm border-b-2 -mb-px border-transparent text-ink-500 font-medium">Helpdesk</a>
      </nav>
      <div class="flex items-center gap-2.5 ml-auto">
        <svg class="w-5 h-5 text-ink-400" fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
        <div class="w-7 h-7 rounded-full bg-rose-500 flex items-center justify-center text-white text-[10px] font-bold">AP</div>
      </div>
    </div>
  </header>

  <main class="max-w-2xl mx-auto px-4 pt-12 pb-24">
    <section id="choose">
      <h1 class="text-2xl font-bold text-ink-900">Abonament Eventya</h1>
      <p class="text-[14px] text-ink-500 mt-1 mb-8">Toată echipa e inclusă. Plătești doar pachetul și modulele pe care le folosești.</p>
      <div id="picker"></div>
    </section>

    <section id="sent" hidden class="text-center pt-10">
      <div class="w-12 h-12 mx-auto rounded-full bg-emerald-50 dark:bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 flex items-center justify-center">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>
      </div>
      <h1 class="text-2xl font-bold text-ink-900 mt-4">Cererea a ajuns la noi</h1>
      <p class="text-[14px] text-ink-500 mt-1">Echipa Eventya îți răspunde cu oferta, apoi setează noul abonament.</p>
      <button type="button" id="again" class="btn btn--ghost mt-6">Înapoi la abonament</button>
    </section>
  </main>

  <script src="../onboarding-clienti-noi/abonament.js"></script>
  <script>
    function mount() {
      document.getElementById('choose').hidden = false;
      document.getElementById('sent').hidden = true;
      Abonament(document.getElementById('picker'), {
        mode: 'upgrade', billing: 'contract',
        current: { base: 'web', modules: ['media'] }, currentInterval: 'monthly',
        onDone: function () {
          document.getElementById('choose').hidden = true;
          document.getElementById('sent').hidden = false;
        }
      });
    }
    document.getElementById('again').addEventListener('click', mount);
    mount();
  </script>

  <button type="button" class="btn fixed bottom-4 right-4 shadow-lg"
    onclick="(function(){var d=document.documentElement;var on=d.getAttribute('data-theme')==='dark';d.setAttribute('data-theme',on?'':'dark');localStorage.setItem('proto-theme',on?'light':'dark');})()">
    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
  </button>
</body>
</html>
