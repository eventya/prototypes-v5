<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workspace name · Contul și spațiul de lucru</title>
  <script>
    (function () {
      var t = localStorage.getItem('proto-theme');
      if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
  <link rel="stylesheet" href="../../assets/application.css">
</head>
<body class="bg-surface-50 text-ink-800 font-sans antialiased">

  <div class="rounded-xl border border-amber-200 dark:border-amber-500/20 bg-amber-50/60 dark:bg-amber-500/5 px-4 py-2.5 m-4 flex flex-wrap gap-3 items-center justify-between">
    <div class="flex items-center gap-2">
      <span class="w-1.5 h-1.5 rounded-full bg-amber-500"></span>
      <span class="text-[11px] font-semibold text-amber-700 dark:text-amber-300">#5 · Workspace name · /setup</span>
    </div>
    <div class="flex items-center gap-3 text-[11px] font-medium text-amber-700 dark:text-amber-300">
      <a href="05-nume-spatiu.html" class="hover:underline">primul spațiu</a>
      <a href="05-nume-spatiu.html?back=1" class="hover:underline">are deja spații</a>
      <a href="index.html" class="hover:underline">← înapoi la set</a>
    </div>
  </div>

  <header class="h-12 px-4 sm:px-6 flex items-center" id="header"></header>

  <main class="flex flex-col items-center px-4 pt-2 pb-20 sm:pt-6">
    <a href="#" aria-label="eventya.net" class="mb-10">
      <img src="../emails/img/eventya-logo.svg" alt="Eventya" class="h-8 dark:hidden">
      <img src="../emails/img/eventya-logo-dark.svg" alt="Eventya" class="h-8 hidden dark:block">
    </a>

    <div class="w-full max-w-100 bg-surface-0 border border-surface-200 rounded-2xl shadow-sm p-6 sm:p-8">
      <form action="06-template.html">
        <h1 class="text-xl font-semibold text-ink-900"><label for="name">What's your workspace called?</label></h1>
        <p class="text-sm text-ink-500 mt-1" id="name-hint">Usually your organization's name. You can change it later.</p>

        <input id="name" name="name" class="input mt-6" autocomplete="organization" maxlength="100" aria-describedby="name-hint" required autofocus>

        <div class="grid grid-cols-[auto_1fr] gap-3 mt-5">
          <a href="#" class="btn btn--ghost">Back</a>
          <button class="btn btn--primary">Continue</button>
        </div>
      </form>
    </div>

    <p class="mt-6 text-sm text-ink-500">ana@muzeuldemo.ro · <a href="01-email.html" class="font-medium text-ink-700 hover:underline">Sign out</a></p>
  </main>

  <script>
    var q = new URLSearchParams(location.search);
    var form = document.querySelector('form');
    // Numele și template-ul de pe site merg mai departe, ca să le găsești completate dacă te întorci.
    if (q.get('name')) document.getElementById('name').value = q.get('name');
    ['template', 'back'].forEach(function (key) {
      if (q.get(key)) form.insertAdjacentHTML('afterbegin', '<input type="hidden" name="' + key + '" value="' + q.get(key) + '">');
    });
    // Back, lângă Continue, duce pe eventya.net.
  </script>

  <button type="button" class="btn fixed bottom-4 right-4 shadow-lg" aria-label="Dark mode"
    onclick="(function(){var d=document.documentElement;var on=d.getAttribute('data-theme')==='dark';d.setAttribute('data-theme',on?'':'dark');localStorage.setItem('proto-theme',on?'light':'dark');})()">
    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
  </button>
</body>
</html>
