<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Setting up · Contul și spațiul de lucru</title>
  <script>
    (function () {
      var t = localStorage.getItem('proto-theme');
      if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
  <link rel="stylesheet" href="../../assets/application.css">
</head>
<body class="bg-surface-50 text-ink-800 font-sans antialiased">

  <div class="rounded-xl border border-amber-200 dark:border-amber-500/20 bg-amber-50/60 dark:bg-amber-500/5 px-4 py-2.5 m-4 flex flex-wrap gap-3 items-center justify-between">
    <div class="flex items-center gap-2">
      <span class="w-1.5 h-1.5 rounded-full bg-amber-500"></span>
      <span class="text-[11px] font-semibold text-amber-700 dark:text-amber-300">#7 · Setting up · /setup/preparing/:slug</span>
    </div>
    <div class="flex items-center gap-3 text-[11px] font-medium text-amber-700 dark:text-amber-300">
      <button type="button" id="replay" class="hover:underline">din nou</button>
      <a href="index.html" class="hover:underline">← înapoi la set</a>
    </div>
  </div>

  <header class="h-12 px-4 sm:px-6 flex items-center"></header>

  <main class="flex flex-col items-center px-4 pt-2 pb-20 sm:pt-6">
    <a href="#" aria-label="eventya.net" class="mb-10">
      <img src="../emails/img/eventya-logo.svg" alt="Eventya" class="h-8 dark:hidden">
      <img src="../emails/img/eventya-logo-dark.svg" alt="Eventya" class="h-8 hidden dark:block">
    </a>

    <div class="w-full max-w-100 bg-surface-0 border border-surface-200 rounded-2xl shadow-sm p-6 sm:p-8" aria-live="polite">
      <h1 class="text-xl font-semibold text-ink-900">Setting up <span id="name">Demo Museum</span></h1>
      <p class="text-sm text-ink-500 mt-1">It takes under a minute. It opens by itself when it's ready.</p>

      <ol class="mt-6 space-y-3 text-sm" id="steps">
        <li class="flex items-center gap-3">Workspace created</li>
        <li class="flex items-center gap-3">Copying pages and content</li>
        <li class="flex items-center gap-3">Setting up menus and images</li>
      </ol>
    </div>
  </main>

  <script>
    var q = new URLSearchParams(location.search);
    if (q.get('name')) document.getElementById('name').textContent = q.get('name');

    // Trei stări pe rând: gata (bifă), în lucru (cerc care se rotește), urmează (punct).
    var icons = {
      done: '<span class="w-5 h-5 rounded-full bg-primary-500 text-white flex items-center justify-center shrink-0"><svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg></span>',
      active: '<span class="w-5 h-5 shrink-0 flex items-center justify-center"><svg class="w-5 h-5 text-primary-500 animate-spin" fill="none" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-opacity=".2" stroke-width="2.5"/><path d="M21 12a9 9 0 0 0-9-9" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg></span>',
      next: '<span class="w-5 h-5 shrink-0 flex items-center justify-center"><span class="w-1.5 h-1.5 rounded-full bg-surface-300"></span></span>'
    };
    var steps = document.querySelectorAll('#steps li');
    var labels = Array.prototype.map.call(steps, function (li) { return li.textContent; });
    function render(current) {
      steps.forEach(function (li, i) {
        var s = i < current ? 'done' : i === current ? 'active' : 'next';
        li.innerHTML = icons[s] + '<span class="' + (s === 'next' ? 'text-ink-400' : 'text-ink-800') + '">' + labels[i] + '</span>';
      });
    }
    var timers = [];
    function play() {
      timers.forEach(clearTimeout);
      render(1);
      timers = [setTimeout(function () { render(2); }, 2500)];
    }
    document.getElementById('replay').addEventListener('click', play);
    play();
  </script>

  <button type="button" class="btn fixed bottom-4 right-4 shadow-lg" aria-label="Dark mode"
    onclick="(function(){var d=document.documentElement;var on=d.getAttribute('data-theme')==='dark';d.setAttribute('data-theme',on?'':'dark');localStorage.setItem('proto-theme',on?'light':'dark');})()">
    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
  </button>
</body>
</html>
