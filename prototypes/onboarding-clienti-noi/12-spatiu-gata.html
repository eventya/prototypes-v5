<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pregătim spațiul · Onboarding clienți noi</title>
  <script>
    (function () {
      var t = localStorage.getItem('proto-theme');
      if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
  <link rel="stylesheet" href="../../assets/application.css">
  <link rel="stylesheet" href="flow.css">
</head>
<body class="bg-surface-0 text-ink-800 font-sans antialiased">

  <div class="rounded-xl border border-amber-200 dark:border-amber-500/20 bg-amber-50/60 dark:bg-amber-500/5 px-4 py-2.5 m-4 flex flex-wrap gap-3 items-center justify-between">
    <div class="flex items-center gap-2">
      <span class="w-1.5 h-1.5 rounded-full bg-amber-500"></span>
      <span class="text-[11px] font-semibold text-amber-700 dark:text-amber-300">#12 · Pregătim spațiul</span>
    </div>
    <span class="text-[11px] text-amber-700 dark:text-amber-300">Trece singur la Dashboard, cu ghidul de început.</span>
    <a href="index.html" class="text-[11px] font-medium text-amber-700 dark:text-amber-300 hover:underline">← înapoi la set</a>
  </div>

  <header class="vt-header max-w-5xl mx-auto px-4 md:px-8 py-4 flex items-center justify-between gap-4">
    <a href="03-site-antet.html" class="flex items-center gap-2 font-semibold text-ink-900">
      <span class="w-6 h-6 rounded-md bg-linear-to-br from-primary-500 to-sky-400"></span>eventya
    </a>
  </header>

  <main class="vt-main max-w-sm mx-auto px-4 pt-20 pb-24">
    <h1 class="text-2xl font-bold text-ink-900">Pregătim Muzeul Demo</h1>
    <p class="text-[14px] text-ink-500 mt-1">Durează câteva secunde.</p>
    <ol class="mt-10 space-y-4 text-[14px]" id="steps"></ol>
    <a id="go" class="btn btn--primary mt-10 invisible">Intră în spațiul tău</a>
  </main>

  <script>
    var STEPS = ['Spațiul de lucru', 'Perioada de probă, 30 de zile', 'Paginile din template-ul Atrium', 'Paginile legale', 'Helpdesk-ul, cu departamentul Inbox', 'E-mailul de bun venit'];
    var dupa = new URLSearchParams(location.search).get('dupa') || 'trial';
    var target = '17-ghid-de-inceput?dupa=' + dupa;
    var ol = document.getElementById('steps'), go = document.getElementById('go'), i = 0;
    go.href = target;
    function paint() {
      ol.innerHTML = STEPS.map(function (t, k) {
        var done = k < i, now = k === i;
        return '<li class="flex items-center gap-3 ' + (done ? 'text-ink-900' : now ? 'text-ink-700' : 'text-ink-300') + '">' +
          (done ? '<span class="w-5 h-5 rounded-full bg-primary-500 text-white flex items-center justify-center shrink-0"><svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></span>'
            : now ? '<span class="w-5 h-5 rounded-full border-2 border-surface-200 border-t-primary-500 animate-spin shrink-0"></span>'
            : '<span class="w-5 h-5 rounded-full border-2 border-surface-200 shrink-0"></span>') + t + '</li>';
      }).join('');
    }
    function tick() {
      paint();
      if (i < STEPS.length) { i++; setTimeout(tick, 550); return; }
      go.classList.remove('invisible');
      setTimeout(function () { location.href = target; }, 900);
    }
    tick();
  </script>

  <button type="button" class="btn fixed bottom-4 right-4 shadow-lg"
    onclick="(function(){var d=document.documentElement;var on=d.getAttribute('data-theme')==='dark';d.setAttribute('data-theme',on?'':'dark');localStorage.setItem('proto-theme',on?'light':'dark');})()">
    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
  </button>
</body>
</html>
